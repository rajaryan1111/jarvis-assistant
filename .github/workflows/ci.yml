name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      ULTRON_SKIP_DOTENV: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}

      - name: Install core + dev dependencies (from uv.lock)
        run: uv sync --locked --extra dev

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q -x '/\.venv/' .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Scan for hardcoded credentials
        run: uv run --no-sync python -m ultron check-secrets

      - name: Tests
        run: |
          set +e
          uv run --no-sync pytest -q --tb=line > /tmp/pytest.out 2>&1
          rc=$?
          # TEMPORARY DIAGNOSTIC: surface the failing tests as annotations so they can
          # be read through the API. Removed once the cause is known.
          grep -E "^(FAILED|ERROR)" /tmp/pytest.out | head -8 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -30 /tmp/pytest.out | grep -vE "^[[:space:]]*$" | head -8 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $rc
