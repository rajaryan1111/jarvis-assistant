[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.2.0"
description = "Local-first personal voice assistant (JARVIS) with an authenticated localhost HUD."
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Private :: Do Not Upload",
]
# Core: enough to run the HUD server, CLI and text commands. No ML / audio / camera stacks.
dependencies = [
    "flask>=3.0,<4",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "psutil>=5.9",
    "openai>=1.40",
    "wikipedia>=1.4,<2",
    # ultron/tools/project.py falls back to tomli when tomllib is unavailable (Python 3.10);
    # declared so a core-only 3.10 install can still import main / the CLI.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Microphone input for `python main.py`. PyAudio needs PortAudio (macOS: `brew install portaudio`).
voice = ["SpeechRecognition>=3.10", "PyAudio>=0.2.14"]
# Porcupine wake-word listener (needs PICOVOICE_ACCESS_KEY).
wakeword = ["pvporcupine>=3.0", "SpeechRecognition>=3.10", "PyAudio>=0.2.14"]
# Webcam face check (prototype, not authentication) and hand gestures (MediaPipe Tasks API).
# mediapipe itself depends on opencv-contrib-python; requiring opencv-python too would install two
# distributions that overwrite the same cv2 module.
vision = ["opencv-contrib-python>=4.8", "mediapipe>=0.10.14", "numpy>=1.24"]
# Offline knowledge base over your notes/PDFs.
rag = ["sentence-transformers>=2.7", "pypdf>=4.0", "numpy>=1.24"]
# Native macOS menu-bar app (macos/build_app.sh). PyObjC is the only way to build a
# real macOS UI from Python; it is kept optional so the core stays dependency-light.
macos = ["pyobjc-framework-Cocoa>=9.2"]
dev = ["pytest>=8", "ruff>=0.6"]
# Everything except the desktop extra, which is macOS-only by nature.
all = ["jarvis-assistant[voice,wakeword,vision,rag]"]
all-macos = ["jarvis-assistant[voice,wakeword,macos]"]

[project.scripts]
ultron = "ultron.cli:main"

[tool.setuptools]
# Legacy top-level modules are kept where they are (templates/static are resolved from
# the source checkout, so use an editable install: `uv sync` does this by default).
py-modules = [
    "main", "server", "jarvis_logic", "knowledge", "news", "vision",
    "wakeword_listener", "musicLibrary", "client", "macos",
]

[tool.setuptools.packages.find]
include = ["ultron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "live: calls a real model provider; opt-in with ULTRON_LIVE_OPENAI=1 or ULTRON_LIVE_GROQ=1 (docs/M2_1_REAL_MODEL_VALIDATION.md, docs/M2_2_GROQ_PROVIDER.md)",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".jarvis_env", "venv", "env"]

[tool.ruff.lint]
# New code (ultron/, tests/) is held to bugbear + bandit-style security rules.
select = ["E", "F", "W", "B", "S", "I", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests use assert and generate throwaway values.
"tests/**" = ["S101", "S103", "S104", "S105", "S106", "S108", "S310", "S603", "S607"]
# Legacy JARVIS modules are linted for real errors (pyflakes) only; they are not reformatted
# in M1. Their subprocess / URL usage is reviewed in docs/ULTRON_ARCHITECTURE_AUDIT.md.
"main.py" = ["E", "W", "B", "S", "I", "UP"]
"client.py" = ["E", "W", "B", "S", "I", "UP"]
"vision.py" = ["E", "W", "B", "S", "I", "UP"]
"knowledge.py" = ["E", "W", "B", "S", "I", "UP"]
"musicLibrary.py" = ["E", "W", "B", "S", "I", "UP"]
"wakeword_listener.py" = ["E", "W", "B", "S", "I", "UP"]
"jarvis_logic.py" = ["E", "W", "B", "S", "I", "UP"]
"news.py" = ["I", "UP"]
"server.py" = ["I", "UP"]
